<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded cream background container for high contrast across browser dark/light themes -->
  <rect width="64" height="64" rx="16" fill="#FFFBEA"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#FDE68A" stroke-width="1.5"/>

  <g transform="translate(7, 5)">
    <!-- Red Accent Vibe Arcs (top-right of crown) -->
    <path d="M 37 6 C 39 8 40 10 40 13" fill="none" stroke="#F46D70" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 42 4 C 45 7 46 11 46 15" fill="none" stroke="#F46D70" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Pineapple Crown Leaves (Leaf Green #78BD58) -->
    <!-- Back leaf left -->
    <path d="M 21 21 C 15 14 13 8 18 5 C 22 7 24 14 25 21 Z" fill="#68A949"/>
    <!-- Back leaf right -->
    <path d="M 29 21 C 35 14 37 8 32 5 C 28 7 26 14 25 21 Z" fill="#68A949"/>
    
    <!-- Main Center Leaf -->
    <path d="M 20 22 C 18 12 21 3 25 2 C 29 3 32 12 30 22 Z" fill="#78BD58"/>
    <!-- Center Leaf Ridge Highlight -->
    <path d="M 25 4 Q 25 14 25 22" fill="none" stroke="#8DCE6D" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left Flaring Leaf -->
    <path d="M 22 22 C 14 18 8 11 10 7 C 14 6 19 13 23 21 Z" fill="#78BD58"/>
    <!-- Right Flaring Leaf -->
    <path d="M 28 22 C 36 18 42 11 40 7 C 36 6 31 13 27 21 Z" fill="#78BD58"/>

    <!-- Pineapple Body Clip Path for Diamond Grid Pattern -->
    <defs>
      <clipPath id="bodyClip">
        <!-- Rounded oval/barrel body -->
        <rect x="7" y="19" width="36" height="32" rx="15" ry="16"/>
      </clipPath>
    </defs>

    <!-- Pineapple Yellow Body (#FFD34E) -->
    <rect x="7" y="19" width="36" height="32" rx="15" ry="16" fill="#FFD34E"/>

    <!-- Diamond Lattice Texture (#DEA71E) clipped inside body -->
    <g clip-path="url(#bodyClip)" stroke="#DEA71E" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <!-- Diagonals \ -->
      <line x1="0" y1="12" x2="45" y2="47"/>
      <line x1="0" y1="22" x2="45" y2="57"/>
      <line x1="10" y1="12" x2="55" y2="47"/>
      <line x1="-10" y1="12" x2="35" y2="47"/>
      <line x1="20" y1="12" x2="65" y2="47"/>

      <!-- Diagonals / -->
      <line x1="50" y1="12" x2="5" y2="47"/>
      <line x1="60" y1="22" x2="15" y2="57"/>
      <line x1="40" y1="12" x2="-5" y2="47"/>
      <line x1="30" y1="12" x2="-15" y2="47"/>
      <line x1="70" y1="12" x2="25" y2="47"/>
    </g>

    <!-- Gentle Highlight on upper left -->
    <ellipse cx="16" cy="27" rx="3.5" ry="2" fill="#FFFBEA" opacity="0.6"/>
  </g>
</svg>

